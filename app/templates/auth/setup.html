<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a password — Breakout Billing</title>
  <link rel="icon" type="image/png" href="/static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 text-sm">
  <div class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6">
    <div class="flex items-center gap-2 mb-2">
      <img src="/static/images/logo.png" alt="" class="w-8 h-8" />
      <span class="font-bold text-gray-800 dark:text-gray-100">Breakout <span class="text-blue-500">Billing</span></span>
    </div>
    <p class="text-gray-500 dark:text-gray-400 mb-4">Set a password to protect this practice's data.</p>
    {% if error %}
    <div class="mb-3 px-3 py-2 rounded-md bg-red-50 text-red-700 border border-red-200 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" action="/setup" class="space-y-3">
      <label class="block">
        <span class="text-gray-600 dark:text-gray-300">Password</span>
        <input type="password" name="password" required autofocus minlength="8"
               class="mt-1 w-full border border-gray-200 dark:border-slate-600 rounded-md px-3 py-2 bg-white dark:bg-slate-900" />
      </label>
      <label class="block">
        <span class="text-gray-600 dark:text-gray-300">Confirm password</span>
        <input type="password" name="confirm" required minlength="8"
               class="mt-1 w-full border border-gray-200 dark:border-slate-600 rounded-md px-3 py-2 bg-white dark:bg-slate-900" />
      </label>
      <button type="submit"
              class="w-full px-4 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
        Set password
      </button>
    </form>
  </div>
</body>
</html>
