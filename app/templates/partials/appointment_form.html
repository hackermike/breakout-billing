<form hx-post="/calendar/day/{{ date_str }}/appointments"
      hx-target="#day-detail" hx-swap="innerHTML"
      class="mt-3 p-3 border border-slate-200 rounded-lg bg-slate-50 space-y-2.5 text-sm">
  <div class="font-medium text-gray-700">New appointment</div>

  <label class="block">
    <span class="text-xs text-gray-500">Client</span>
    <select name="client_id" required
            class="mt-0.5 w-full border border-gray-200 rounded-md px-2 py-1.5 bg-white">
      {% for c in clients %}
      <option value="{{ c.id }}">{{ c.full_name }}</option>
      {% endfor %}
    </select>
  </label>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500">Time</span>
      <input type="time" name="time" value="09:00" required
             class="mt-0.5 w-full border border-gray-200 rounded-md px-2 py-1.5 bg-white" />
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500">Duration</span>
      <select name="duration_minutes"
              class="mt-0.5 w-full border border-gray-200 rounded-md px-2 py-1.5 bg-white">
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="50" selected>50 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
      </select>
    </label>
  </div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500">CPT code</span>
      <select name="cpt_code"
              class="mt-0.5 w-full border border-gray-200 rounded-md px-2 py-1.5 bg-white">
        <option value="90837">90837 — 60 min psychotherapy</option>
        <option value="90834">90834 — 45 min psychotherapy</option>
        <option value="90832">90832 — 30 min psychotherapy</option>
        <option value="90847">90847 — family therapy</option>
        <option value="90853">90853 — group therapy</option>
      </select>
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500">Status</span>
      <select name="status"
              class="mt-0.5 w-full border border-gray-200 rounded-md px-2 py-1.5 bg-white">
        <option value="scheduled" selected>Scheduled</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="no_show">No show</option>
      </select>
    </label>
  </div>

  <div class="flex gap-2 pt-1">
    <button type="submit"
            class="flex-1 px-3 py-1.5 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
      Save
    </button>
    <button type="button" onclick="this.closest('form').remove()"
            class="px-3 py-1.5 border border-gray-200 rounded-md hover:bg-gray-100 transition-colors">
      Cancel
    </button>
  </div>
</form>
