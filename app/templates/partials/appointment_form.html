<form hx-post="/calendar/day/{{ date_str }}/appointments"
      hx-target="#day-detail" hx-swap="innerHTML"
      class="mt-3 p-3 border border-slate-200 dark:border-slate-700 rounded-lg
             bg-slate-50 dark:bg-slate-800 space-y-2.5 text-sm">
  <div class="font-medium text-gray-700 dark:text-gray-200">New appointment</div>

  <label class="block">
    <span class="text-xs text-gray-500 dark:text-gray-400">Client</span>
    <select name="client_id" required
            class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                   bg-white dark:bg-slate-900">
      {% for c in clients %}
      <option value="{{ c.id }}">{{ c.full_name }}</option>
      {% endfor %}
    </select>
  </label>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Time</span>
      <input type="time" name="time" value="09:00" required
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Duration</span>
      <select name="duration_minutes"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="50" selected>50 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
      </select>
    </label>
  </div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">CPT code</span>
      <select name="cpt_code"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        {% for c in cpt_codes %}
        <option value="{{ c.code }}">{{ c.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="block w-24">
      <span class="text-xs text-gray-500 dark:text-gray-400">Fee ($)</span>
      <input type="number" name="fee" step="0.01" min="0" placeholder="auto"
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
  </div>

  <label class="block">
    <span class="text-xs text-gray-500 dark:text-gray-400">Status</span>
    <select name="status"
            class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                   bg-white dark:bg-slate-900">
      <option value="scheduled" selected>Scheduled</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
      <option value="no_show">No show</option>
    </select>
  </label>

  <label class="block">
    <span class="text-xs text-gray-500 dark:text-gray-400">Telehealth link (optional)</span>
    <input type="url" name="telehealth_url" placeholder="https://…"
           class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                  bg-white dark:bg-slate-900" />
  </label>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Repeat</span>
      <select name="repeat" id="repeat-select"
              onchange="document.getElementById('occurrences-field').classList.toggle('hidden', this.value === 'none')"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        <option value="none" selected>Does not repeat</option>
        <option value="weekly">Weekly</option>
        <option value="biweekly">Every 2 weeks</option>
      </select>
    </label>
    <label class="block w-28 hidden" id="occurrences-field">
      <span class="text-xs text-gray-500 dark:text-gray-400">Occurrences</span>
      <input type="number" name="occurrences" value="8" min="1" max="52"
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
  </div>

  <div class="flex gap-2 pt-1">
    <button type="submit"
            class="flex-1 px-3 py-1.5 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
      Save
    </button>
    <button type="button" onclick="this.closest('form').remove()"
            class="px-3 py-1.5 border border-gray-200 dark:border-slate-600 rounded-md
                   hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
      Cancel
    </button>
  </div>
</form>
