<form hx-post="/appointments/{{ appointment.id }}/edit"
      hx-target="#day-detail" hx-swap="innerHTML"
      class="mt-2 p-3 border border-slate-200 dark:border-slate-700 rounded-lg
             bg-slate-50 dark:bg-slate-800 space-y-2.5 text-sm">
  <div class="font-medium text-gray-700 dark:text-gray-200">Edit appointment</div>

  {% if appointment.series_id %}
  <div class="rounded-md bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 p-2">
    <div class="text-xs font-medium text-indigo-700 dark:text-indigo-300 mb-1">🔁 Part of a recurring series</div>
    <label class="block">
      <span class="text-xs text-gray-500 dark:text-gray-400">Apply changes to</span>
      <select name="scope"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        <option value="this" selected>This appointment only</option>
        <option value="future">This and all future appointments</option>
      </select>
    </label>
  </div>
  {% endif %}

  <label class="block">
    <span class="text-xs text-gray-500 dark:text-gray-400">Client</span>
    <select name="client_id" required
            class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                   bg-white dark:bg-slate-900">
      {% for c in clients %}
      <option value="{{ c.id }}" {{ 'selected' if c.id == appointment.client_id }}>{{ c.full_name }}</option>
      {% endfor %}
    </select>
  </label>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Date</span>
      <input type="date" name="date" value="{{ date_val }}" required
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Time</span>
      <input type="time" name="time" value="{{ time_val }}" required
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
  </div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Duration</span>
      <select name="duration_minutes"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        {% for d in [30, 45, 50, 60, 90] %}
        <option value="{{ d }}" {{ 'selected' if d == appointment.duration_minutes }}>{{ d }} min</option>
        {% endfor %}
      </select>
    </label>
    <label class="block w-24">
      <span class="text-xs text-gray-500 dark:text-gray-400">Fee ($)</span>
      <input type="number" name="fee" step="0.01" min="0" value="{{ '%.2f'|format(appointment.fee or 0) }}"
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
  </div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">CPT code</span>
      <select name="cpt_code"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        {% for c in cpt_codes %}
        <option value="{{ c.code }}" {{ 'selected' if c.code == appointment.cpt_code }}>{{ c.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Status</span>
      <select name="status"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        {% for value, label in [
          ('scheduled', 'Scheduled'), ('completed', 'Completed'),
          ('cancelled', 'Cancelled'), ('no_show', 'No show')] %}
        <option value="{{ value }}" {{ 'selected' if value == appointment.status }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <label class="block">
    <span class="text-xs text-gray-500 dark:text-gray-400">Telehealth link (optional)</span>
    <input type="url" name="telehealth_url" value="{{ appointment.telehealth_url or '' }}" placeholder="https://…"
           class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                  bg-white dark:bg-slate-900" />
  </label>

  <div class="flex gap-2 pt-1">
    <button type="submit"
            class="flex-1 px-3 py-1.5 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
      Save changes
    </button>
    <button type="button" onclick="this.closest('form').remove()"
            class="px-3 py-1.5 border border-gray-200 dark:border-slate-600 rounded-md
                   hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
      Cancel
    </button>
    <button type="button"
            hx-post="/appointments/{{ appointment.id }}/delete"
            hx-target="#day-detail" hx-swap="innerHTML"
            hx-include="[name='scope']"
            hx-confirm="{% if appointment.series_id %}Delete the selected appointment(s) and their payments? This cannot be undone.{% else %}Delete this appointment and its payments? This cannot be undone.{% endif %}"
            class="px-3 py-1.5 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-300
                   rounded-md hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors">
      Delete
    </button>
  </div>
</form>
