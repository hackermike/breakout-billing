<div id="chips-{{ date_str }}" class="space-y-0.5"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for appt in appointments[:3] %}
  <div class="text-xs px-1.5 py-0.5 rounded border truncate {{ status_colors[appt.status] }}">
    {{ appt.datetime.strftime('%I:%M').lstrip('0') }} {{ appt.client.last_name }}
  </div>
  {% endfor %}
  {% if appointments|length > 3 %}
  <div class="text-xs text-gray-400 px-1">+{{ appointments|length - 3 }} more</div>
  {% endif %}
</div>
