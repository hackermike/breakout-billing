<form hx-post="/appointments/{{ appointment.id }}/payments"
      hx-target="#day-detail" hx-swap="innerHTML"
      class="mt-2 p-3 border border-slate-200 dark:border-slate-700 rounded-lg
             bg-slate-50 dark:bg-slate-800 space-y-2.5 text-sm">
  <div class="font-medium text-gray-700 dark:text-gray-200">Record payment</div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Amount ($)</span>
      <input type="number" name="amount" step="0.01" min="0"
             value="{{ '%.2f'|format(balance if balance > 0 else 0) }}" required
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Date</span>
      <input type="date" name="payment_date" value="{{ today }}" required
             class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                    bg-white dark:bg-slate-900" />
    </label>
  </div>

  <div class="flex gap-2">
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Method</span>
      <select name="payment_method"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        <option value="card">Card</option>
        <option value="cash">Cash</option>
        <option value="check">Check</option>
        <option value="insurance">Insurance</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label class="block flex-1">
      <span class="text-xs text-gray-500 dark:text-gray-400">Payer</span>
      <select name="payer"
              class="mt-0.5 w-full border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1.5
                     bg-white dark:bg-slate-900">
        <option value="client">Client (self-pay)</option>
        <option value="insurance">Insurance</option>
      </select>
    </label>
  </div>

  <div class="flex gap-2 pt-1">
    <button type="submit"
            class="flex-1 px-3 py-1.5 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
      Save payment
    </button>
    <button type="button" onclick="this.closest('form').remove()"
            class="px-3 py-1.5 border border-gray-200 dark:border-slate-600 rounded-md
                   hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
      Cancel
    </button>
  </div>
</form>
