[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-core"
version = "0.1.0"
description = "Shared domain library for Breakout Billing and the care platform."
requires-python = ">=3.11"
dependencies = ["fpdf2>=2.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["breakout_core*"]
